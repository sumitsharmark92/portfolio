<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>guestbook — Leave a Message | sumit.sh</title>
  <meta name="description" content="Sign the guestbook — leave a message for Sumit and see what others have said.">
  <meta property="og:title" content="guestbook — Leave a Message">
  <meta property="og:description" content="Sign the guestbook — leave a message for Sumit and see what others have said.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://sumit-labs.me/guestbook.html">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📝</text></svg>">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <canvas id="matrix-rain"></canvas>
  <div class="scanlines"></div>
  <canvas id="particle-canvas"></canvas>

  <main class="app-page">
    <a href="index.html" class="back-link">← back to portfolio</a>

    <h1 class="app-title reveal">guestbook<span class="cursor"></span></h1>
    <p class="app-desc reveal">
      Leave a message, say hello, or share a thought.<br>
      <span id="gbCount" style="color: var(--green);">0</span> messages so far.
    </p>

    <!-- Sign Form -->
    <div class="gb-form-card reveal">
      <h3 class="gb-form-title">$ sign-guestbook</h3>
      <form id="gbForm" autocomplete="off">
        <!-- Honeypot — hidden by JS immediately on load, catches bots that auto-fill -->
        <div id="gbHoneypotWrap" class="gb-honeypot-wrap" aria-hidden="true" hidden>
          <input type="text" name="website" id="gbHoneypot" tabindex="-1" autocomplete="off">
        </div>

        <div class="gb-form-row">
          <label class="gb-label" for="gbName">name <span style="color:var(--text-muted);">(optional)</span></label>
          <input type="text" class="app-input" id="gbName" placeholder="anonymous hacker" maxlength="50">
        </div>

        <div class="gb-form-row">
          <label class="gb-label" for="gbMessage">message <span style="color:var(--red);">*</span></label>
          <textarea class="app-input gb-textarea" id="gbMessage" placeholder="Type something nice (or not)..." maxlength="500" required></textarea>
          <span class="gb-char-count"><span id="gbCharCount">0</span>/500</span>
        </div>

        <div class="gb-form-row">
          <label class="gb-label" for="gbLink">link <span style="color:var(--text-muted);">(optional — your site, github, etc.)</span></label>
          <input type="url" class="app-input" id="gbLink" placeholder="https://..." maxlength="200">
        </div>

        <button type="submit" class="btn btn-primary" id="gbSubmitBtn" style="width:100%;">
          sign guestbook →
        </button>
        <div class="gb-status" id="gbStatus"></div>
      </form>
    </div>

    <!-- Entries -->
    <div class="gb-entries" id="gbEntries">
      <div class="gb-loading">loading messages...</div>
    </div>
  </main>

  <footer class="footer">
    <p>
      built with <span class="heart">♥</span> by
      <a href="index.html">sumit.sh</a> · 2026
    </p>
  </footer>

  <script src="guestbook.js"></script>
  <script src="script.js"></script>
</body>
</html>
